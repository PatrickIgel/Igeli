<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Igel Co-Op – Taktik & Rätsel</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2b2f36; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        #menuOverlay {
            position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
            background: rgba(13, 15, 18, 0.82); padding: 16px; touch-action: auto;
        }
        #menuOverlay.hidden { display: none; }
        .menu-card {
            width: 100%; max-width: 420px; background: #1e2229; border: 4px solid #0d0f12; border-radius: 18px;
            padding: 22px; color: #fff; text-align: center; box-shadow: 0 18px 40px rgba(0,0,0,0.55);
        }
        .menu-title { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: 0.3px; }
        .menu-sub { font-size: 14px; color: #9ca3af; margin: 0 0 18px; }
        .menu-btn {
            width: 100%; padding: 14px 16px; margin-bottom: 11px; border: 3px solid #0d0f12; border-radius: 12px;
            font-size: 17px; font-weight: 800; color: #fff; cursor: pointer; touch-action: manipulation;
            transition: transform 0.08s ease;
        }
        .menu-btn:active { transform: translateY(2px); }
        .btn-local { background: #374151; }
        .btn-host { background: #e5534b; }
        .btn-join { background: #20b8f9; color: #0d0f12; }
        .panel-box {
            margin-top: 10px; padding: 14px; background: #14171c; border: 3px solid #0d0f12; border-radius: 12px;
        }
        .panel-box.hidden { display: none; }
        .code-display {
            font-size: 44px; font-weight: 900; letter-spacing: 8px; color: #facc15; margin: 6px 0;
            font-variant-numeric: tabular-nums;
        }
        .join-row { display: flex; gap: 8px; margin-top: 8px; }
        #codeInput {
            flex: 1; min-width: 0; padding: 12px; font-size: 24px; font-weight: 800; text-align: center;
            letter-spacing: 6px; border: 3px solid #0d0f12; border-radius: 10px; background: #fff; color: #0d0f12;
            user-select: auto; -webkit-user-select: auto; touch-action: manipulation;
        }
        #connectBtn {
            padding: 12px 18px; border: 3px solid #0d0f12; border-radius: 10px; background: #22c55e;
            color: #0d0f12; font-size: 16px; font-weight: 800; cursor: pointer; touch-action: manipulation;
        }
        .status-text { font-size: 14px; color: #d1d5db; margin-top: 8px; min-height: 20px; }
    </style>
</head>
<body>
<div id="menuOverlay">
    <div class="menu-card">
        <h1 class="menu-title">Igel Co-Op</h1>
        <p class="menu-sub">Spielmodus wählen</p>
        <button id="btnLocal" class="menu-btn btn-local">Lokal (1 Gerät)</button>
        <button id="btnHost" class="menu-btn btn-host">Raum erstellen (Rot)</button>
        <button id="btnJoin" class="menu-btn btn-join">Beitreten (Blau)</button>

        <div id="hostPanel" class="panel-box hidden">
            <div style="font-size:13px;color:#9ca3af;font-weight:700;">DEIN RAUM-CODE</div>
            <div id="roomCodeDisplay" class="code-display">----</div>
            <div id="hostStatus" class="status-text">Erstelle Raum...</div>
        </div>

        <div id="joinPanel" class="panel-box hidden">
            <div style="font-size:13px;color:#9ca3af;font-weight:700;">4-STELLIGEN CODE EINGEBEN</div>
            <div class="join-row">
                <input id="codeInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234" autocomplete="off">
                <button id="connectBtn">Verbinden</button>
            </div>
            <div id="joinStatus" class="status-text"></div>
        </div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const GAME_W = 1280, GAME_H = 720, MAX_LEVELS = 10;

let view = { scale: 1, offsetX: 0, offsetY: 0, rotation: 0 };
const inputs = { redRight: false, redCurl: false, blueJump: false, blueLeft: false };
const keys = { redRight: false, redCurl: false, blueJump: false, blueLeft: false };
const remoteInputs = { blueJump: false, blueLeft: false };
const activePointers = new Map();

let gameMode = null; // null | 'local' | 'host' | 'client'
let peer = null, conn = null, roomCode = '', clientLevelKey = '', lastSyncTime = 0, lastClientInputSig = '';

const controlButtons = [
    { id: 'redRight', x: 155, y: 615, r: 54, hitR: 70, color: '#e5534b', label: 'RECHTS', sub: 'Laufen' },
    { id: 'redCurl',  x: 315, y: 615, r: 54, hitR: 70, color: '#e5534b', label: 'KUGEL',  sub: 'Schwer/Anker' },
    { id: 'blueJump', x: 965, y: 615, r: 54, hitR: 70, color: '#20b8f9', label: 'SPRUNG', sub: 'Katapult' },
    { id: 'blueLeft', x: 1125,y: 615, r: 54, hitR: 70, color: '#20b8f9', label: 'LINKS',  sub: 'Laufen' }
];
const uiButtons = { resetRoom: { x: GAME_W / 2 - 90, y: GAME_H - 52, w: 180, h: 40 }, sound: { x: GAME_W - 68, y: 14, w: 52, h: 42 } };

function getVisibleButtons() {
    if (gameMode === 'host') return controlButtons.filter(b => b.id.startsWith('red'));
    if (gameMode === 'client') return controlButtons.filter(b => b.id.startsWith('blue'));
    return controlButtons;
}

let audioCtx = null, soundOn = true;
function playTone(freq, type, dur, vol = 0.1, slide = null) {
    if (!soundOn) return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, now);
        if (slide) osc.frequency.exponentialRampToValueAtTime(slide, now + dur);
        g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + dur);
    } catch (e) {}
}

const state = { levelIndex: 0, levelSeed: (Math.random() * 1e9) | 0, hearts: 5, camX: 0, won: false };
const player = { x: 140, y: 380, vx: 0, vy: 0, r: 24, grounded: false, curled: false, rot: 0, facing: 1, aimState: 0, aimAngle: 0.78, aimDir: 1, slingshotCharge: 0, catapultFlight: false, invuln: 0, wasJumpPressed: false };
let platforms = [], boxes = [], buttons = [], gates = [], breakables = [], winds = [], hazards = [], zombies = [], mushrooms = [], ramps = [], seesaws = [], goalX = 2000;

function createRng(seed) {
    let s = (seed >>> 0) || 123456789;
    return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}
const getModuleCount = idx => idx < 3 ? 1 : idx < 5 ? 2 : idx - 2;

// 14 Nahtlose Module (0-10 Standard ab Stufe 1, 11-13 Experten ab Stufe 6)
const LEVEL_MODULES = [
    // 0: Aufwind & Glasboden + Gegenwind-Schalter
    (sx, sy, id, rng) => {
        const topY = Math.max(250, sy - 190), botY = 500, endY = 460;
        platforms.push({ x: sx, y: sy, w: 120, h: GAME_H - sy }, { x: sx + 260, y: topY, w: 420, h: 36 }, { x: sx + 260, y: botY, w: 660, h: GAME_H - botY }, { x: sx + 920, y: endY, w: 140, h: GAME_H - endY });
        winds.push({ x: sx + 125, y: topY - 70, w: 130, h: sy - topY + 130, vy: -560, vx: 0, active: true }, { x: sx + 520, y: botY - 150, w: 280, h: 150, vy: 0, vx: -420, active: true });
        breakables.push({ x: sx + 430 + Math.floor(rng() * 50), y: topY, w: 110, h: 36, type: 'floor' });
        buttons.push({ id, x: sx + 340, y: botY - 12, w: 64, h: 12, pressed: false, sticky: true });
        gates.push({ id, x: sx + 830, y: botY - 180, w: 28, h: 180, openH: 0 });
        if (rng() > 0.35) zombies.push({ x: sx + 640, y: botY, dir: -1, dead: false });
        return { width: 1060, endY };
    },
    // 1: Kiste & Bodenschalter mit Stachelgrube
    (sx, sy, id, rng) => {
        const ledgeY = sy - 90, pitY = 520, endY = sy;
        platforms.push({ x: sx, y: sy, w: 680, h: GAME_H - sy }, { x: sx + 160, y: ledgeY, w: 190, h: 30 }, { x: sx + 680, y: pitY, w: 240, h: GAME_H - pitY }, { x: sx + 920, y: endY, w: 140, h: GAME_H - endY });
        boxes.push({ x: sx + 210 + Math.floor(rng() * 40), y: ledgeY - 52, w: 48, h: 48, vx: 0, vy: 0 });
        buttons.push({ id, x: sx + 460, y: sy - 12, w: 64, h: 12, pressed: false });
        gates.push({ id, x: sx + 590, y: sy - 160, w: 28, h: 160, openH: 0 });
        hazards.push({ x: sx + 715, y: pitY - 16, w: 170, h: 16 });
        if (rng() > 0.45) zombies.push({ x: sx + 420, y: sy, dir: -1, dead: false });
        return { width: 1060, endY };
    },
    // 2: Katapult-Wanddurchbruch & Zombie-Wache
    (sx, sy, id, rng) => {
        const upY = Math.max(340, sy - 90);
        platforms.push({ x: sx, y: sy, w: 300, h: GAME_H - sy }, { x: sx + 300, y: upY, w: 580, h: GAME_H - upY });
        breakables.push({ x: sx + 520, y: upY - 120, w: 36, h: 120, type: 'wall' });
        zombies.push({ x: sx + 740, y: upY, dir: -1, dead: false });
        if (rng() > 0.5) zombies.push({ x: sx + 220, y: sy, dir: -1, dead: false });
        return { width: 880, endY: upY };
    },
    // 3: Zombie-Patrouille & Stachelgrube mit Aufwind-Rettung
    (sx, sy, id, rng) => {
        const pitY = 520, endY = rng() > 0.5 ? 420 : 480;
        platforms.push({ x: sx, y: sy, w: 240, h: GAME_H - sy }, { x: sx + 240, y: pitY, w: 460, h: GAME_H - pitY }, { x: sx + 360, y: 360, w: 220, h: 30 }, { x: sx + 700, y: endY, w: 220, h: GAME_H - endY });
        hazards.push({ x: sx + 275, y: pitY - 16, w: 390, h: 16 });
        winds.push({ x: sx + 245, y: 230, w: 105, h: 270, vy: -580, vx: 0, active: true }, { x: sx + 585, y: 230, w: 105, h: 270, vy: -580, vx: 0, active: true });
        zombies.push({ x: sx + 520, y: 360, dir: -1, dead: false }, { x: sx + 830, y: endY, dir: -1, dead: false });
        return { width: 920, endY };
    },
    // 4 (Modul 5): Die Kisten-Brücke (Kugel-Anker + Kiste im Aufwind)
    (sx, sy, id) => {
        const endY = sy;
        platforms.push({ x: sx, y: sy, w: 860, h: GAME_H - sy }, { x: sx + 310, y: sy - 210, w: 160, h: 28 });
        winds.push({ x: sx + 330, y: sy - 182, w: 120, h: 182, vy: -560, vx: 0, active: true });
        boxes.push({ x: sx + 366, y: sy - 165, w: 48, h: 48, vx: 0, vy: 0 });
        buttons.push({ id, x: sx + 358, y: sy - 12, w: 64, h: 12, pressed: false });
        gates.push({ id, x: sx + 660, y: sy - 160, w: 28, h: 160, openH: 0 });
        return { width: 860, endY };
    },
    // 5 (Modul 6): Doppel-Glas-Etage (Timing-Stampfer mit Zombie)
    (sx, sy, id) => {
        const topY = Math.max(220, sy - 230), midY = topY + 135, botY = 510, endY = 470;
        platforms.push({ x: sx, y: sy, w: 130, h: GAME_H - sy }, { x: sx + 250, y: topY, w: 170, h: 32 }, { x: sx + 530, y: topY, w: 150, h: 32 },
            { x: sx + 250, y: midY, w: 170, h: 28 }, { x: sx + 530, y: midY, w: 150, h: 28 }, { x: sx + 250, y: botY, w: 650, h: GAME_H - botY }, { x: sx + 900, y: endY, w: 140, h: GAME_H - endY });
        winds.push({ x: sx + 132, y: topY - 60, w: 115, h: sy - topY + 60, vy: -580, vx: 0, active: true });
        breakables.push({ x: sx + 420, y: topY, w: 110, h: 32, type: 'floor' }, { x: sx + 420, y: midY, w: 110, h: 28, type: 'floor' });
        zombies.push({ x: sx + 475, y: midY, dir: -1, dead: false });
        buttons.push({ id, x: sx + 443, y: botY - 12, w: 64, h: 12, pressed: false, sticky: true });
        gates.push({ id, x: sx + 780, y: botY - 170, w: 28, h: 170, openH: 0 });
        return { width: 1040, endY };
    },
    // 6 (Modul 7): Katapult-Bande (Winkel-Präzision über Stachelgrube)
    (sx, sy) => {
        const pitY = 530, highY = Math.max(330, sy - 80);
        platforms.push({ x: sx, y: sy, w: 240, h: GAME_H - sy }, { x: sx + 240, y: pitY, w: 220, h: GAME_H - pitY }, { x: sx + 460, y: highY, w: 460, h: GAME_H - highY });
        hazards.push({ x: sx + 265, y: pitY - 16, w: 170, h: 16 });
        breakables.push({ x: sx + 545, y: highY - 120, w: 36, h: 120, type: 'wall' });
        zombies.push({ x: sx + 780, y: highY, dir: -1, dead: false });
        return { width: 920, endY: highY };
    },
    // 7 (Modul 8): Wind-Slalom (Schweben & Einrollen im Wechsel)
    (sx, sy) => {
        const pitY = 530, endY = 460;
        platforms.push({ x: sx, y: sy, w: 140, h: GAME_H - sy }, { x: sx + 140, y: pitY, w: 640, h: GAME_H - pitY }, { x: sx + 380, y: 240, w: 160, h: 36 }, { x: sx + 780, y: endY, w: 160, h: GAME_H - endY });
        hazards.push({ x: sx + 160, y: pitY - 16, w: 600, h: 16 }, { x: sx + 390, y: 276, w: 140, h: 16 });
        winds.push({ x: sx + 180, y: 210, w: 140, h: 300, vy: -590, vx: 0, active: true }, { x: sx + 590, y: 210, w: 140, h: 300, vy: -590, vx: 0, active: true });
        return { width: 940, endY };
    },
    // 8 (Modul 9): Der Gegenwind-Katapult-Tunnel
    (sx, sy) => {
        platforms.push({ x: sx, y: sy, w: 880, h: GAME_H - sy }, { x: sx + 150, y: sy - 145, w: 580, h: 32 });
        winds.push({ x: sx + 230, y: sy - 113, w: 460, h: 113, vy: 0, vx: -460, active: true });
        boxes.push({ x: sx + 170, y: sy - 48, w: 48, h: 48, vx: 0, vy: 0 });
        return { width: 880, endY: sy };
    },
    // 9 (Modul 10): Kisten-Aufzug (Waldpilz-Trampolin)
    (sx, sy, id) => {
        const highY = Math.max(290, sy - 170);
        platforms.push({ x: sx, y: sy, w: 920, h: GAME_H - sy }, { x: sx + 340, y: highY, w: 280, h: 32 });
        mushrooms.push({ x: sx + 220, y: sy - 26, w: 72, h: 26, vy: -760, bounce: 0 });
        boxes.push({ x: sx + 370, y: highY - 48, w: 48, h: 48, vx: 0, vy: 0 });
        buttons.push({ id, x: sx + 510, y: highY - 12, w: 64, h: 12, pressed: false, sticky: true });
        gates.push({ id, x: sx + 740, y: sy - 170, w: 28, h: 170, openH: 0 });
        return { width: 920, endY: sy };
    },
    // 10 (Modul 11): Zombie-Kegeln (Steile Roll-Rampe)
    (sx, sy) => {
        const dropY = Math.min(530, sy + 110);
        platforms.push({ x: sx, y: sy, w: 160, h: GAME_H - sy }, { x: sx + 380, y: dropY, w: 640, h: GAME_H - dropY });
        ramps.push({ x1: sx + 160, y1: sy, x2: sx + 380, y2: dropY });
        zombies.push({ x: sx + 520, y: dropY, dir: -1, dead: false }, { x: sx + 630, y: dropY, dir: -1, dead: false }, { x: sx + 740, y: dropY, dir: -1, dead: false });
        breakables.push({ x: sx + 830, y: dropY - 120, w: 36, h: 120, type: 'wall' });
        return { width: 1020, endY: dropY };
    },
    // 11 (Modul 12 - Experte ab Level 6): Die Wind-Waage (Kippschalter)
    (sx, sy) => {
        const pitY = 535, endY = Math.max(350, sy - 60);
        platforms.push({ x: sx, y: sy, w: 190, h: GAME_H - sy }, { x: sx + 190, y: pitY, w: 440, h: GAME_H - pitY }, { x: sx + 630, y: endY, w: 330, h: GAME_H - endY });
        hazards.push({ x: sx + 210, y: pitY - 16, w: 400, h: 16 });
        winds.push({ x: sx + 210, y: 240, w: 125, h: 270, vy: -580, vx: 0, active: true });
        seesaws.push({ cx: sx + 430, cy: sy + 10, halfW: 135, angle: -0.22 });
        breakables.push({ x: sx + 685, y: endY - 120, w: 36, h: 120, type: 'wall' });
        return { width: 960, endY };
    },
    // 12 (Modul 13 - Experte ab Level 6): Kisten-Schleuse im Gegenwind
    (sx, sy, id) => {
        const pitY = 535, windId = id + 100;
        platforms.push({ x: sx, y: sy, w: 340, h: GAME_H - sy }, { x: sx + 340, y: pitY, w: 220, h: GAME_H - pitY }, { x: sx + 560, y: sy, w: 620, h: GAME_H - sy });
        hazards.push({ x: sx + 360, y: pitY - 16, w: 180, h: 16 });
        winds.push({ x: sx + 380, y: 220, w: 135, h: 295, vy: -590, vx: 0, active: true }, { id: windId, x: sx + 585, y: sy - 140, w: 260, h: 140, vy: 0, vx: -470, active: true });
        boxes.push({ x: sx + 140, y: sy - 48, w: 48, h: 48, vx: 0, vy: 0 });
        buttons.push({ id: windId, x: sx + 875, y: sy - 12, w: 58, h: 12, pressed: false, sticky: true, toggleWind: true }, { id, x: sx + 690, y: sy - 12, w: 64, h: 12, pressed: false });
        gates.push({ id, x: sx + 1020, y: sy - 165, w: 28, h: 165, openH: 0 });
        return { width: 1180, endY: sy };
    },
    // 13 (Modul 14 - Experte ab Level 6): Stachel-Katapult-Staffel
    (sx, sy, id) => {
        const pitY = 535, endY = 470;
        platforms.push({ x: sx, y: sy, w: 170, h: GAME_H - sy }, { x: sx + 170, y: pitY, w: 860, h: GAME_H - pitY },
            { x: sx + 365, y: sy - 35, w: 135, h: 30 }, { x: sx + 685, y: sy - 135, w: 85, h: 28 }, { x: sx + 880, y: sy - 135, w: 85, h: 28 },
            { x: sx + 720, y: sy + 5, w: 210, h: 30 }, { x: sx + 1030, y: endY, w: 160, h: GAME_H - endY });
        hazards.push({ x: sx + 190, y: pitY - 16, w: 820, h: 16 });
        zombies.push({ x: sx + 430, y: sy - 35, dir: -1, dead: false });
        breakables.push({ x: sx + 770, y: sy - 135, w: 110, h: 28, type: 'floor' });
        buttons.push({ id, x: sx + 793, y: sy - 7, w: 64, h: 12, pressed: false, sticky: true });
        gates.push({ id, x: sx + 1080, y: endY - 165, w: 28, h: 165, openH: 0 });
        return { width: 1190, endY };
    }
];

function loadLevel(idx, newSeed = false) {
    if (newSeed) state.levelSeed = (Math.random() * 1e9) | 0;
    const rng = createRng(state.levelSeed + idx * 7919);
    platforms = []; boxes = []; buttons = []; gates = []; breakables = []; winds = []; hazards = []; zombies = []; mushrooms = []; ramps = []; seesaws = [];
    player.vx = 0; player.vy = 0; player.slingshotCharge = 0; player.aimState = 0; player.catapultFlight = false; player.invuln = 0;

    let curX = 340, curY = 480, lastMod = -1;
    platforms.push({ x: 0, y: curY, w: curX, h: GAME_H - curY });

    const poolSize = idx >= 5 ? LEVEL_MODULES.length : 11;
    const count = getModuleCount(idx);
    for (let m = 0; m < count; m++) {
        let modIdx = (idx >= 5 && m === 0) ? 11 + Math.floor(rng() * 3) : Math.floor(rng() * poolSize);
        if (modIdx === lastMod && poolSize > 1) modIdx = (modIdx + 1) % poolSize;
        lastMod = modIdx;
        const res = LEVEL_MODULES[modIdx](curX, curY, m + 1, rng);
        curX += res.width; curY = res.endY;
    }

    platforms.push({ x: curX, y: curY, w: 460, h: GAME_H - curY });
    goalX = curX + 260;
    player.x = 120; player.y = 410; state.camX = 0;
}

function sendSyncState(force = false) {
    if (gameMode !== 'host' || !conn || !conn.open) return;
    const now = performance.now();
    if (!force && now - lastSyncTime < 33) return;
    lastSyncTime = now;
    conn.send({
        type: 'state',
        levelIndex: state.levelIndex,
        levelSeed: state.levelSeed,
        hearts: state.hearts,
        camX: +state.camX.toFixed(1),
        won: state.won,
        player: {
            x: +player.x.toFixed(1), y: +player.y.toFixed(1), vx: +player.vx.toFixed(1), vy: +player.vy.toFixed(1),
            grounded: player.grounded, curled: player.curled, rot: +player.rot.toFixed(2), facing: player.facing,
            aimState: player.aimState, aimAngle: +player.aimAngle.toFixed(2), slingshotCharge: +player.slingshotCharge.toFixed(2),
            invuln: +player.invuln.toFixed(2)
        },
        boxes: boxes.map(b => [+b.x.toFixed(1), +b.y.toFixed(1)]),
        gates: gates.map(g => +g.openH.toFixed(1)),
        buttons: buttons.map(b => b.pressed ? 1 : 0),
        zombies: zombies.map(z => [+z.x.toFixed(1), +z.y.toFixed(1), z.dir, z.dead ? 1 : 0]),
        winds: winds.map(w => w.active ? 1 : 0),
        breakables: breakables.map(br => [Math.round(br.x), Math.round(br.y)]),
        seesaws: seesaws.map(sw => +sw.angle.toFixed(3)),
        mushrooms: mushrooms.map(m => +m.bounce.toFixed(2))
    });
}

function applySyncState(d) {
    const key = d.levelIndex + ':' + d.levelSeed;
    if (key !== clientLevelKey) {
        clientLevelKey = key;
        state.levelIndex = d.levelIndex;
        state.levelSeed = d.levelSeed;
        loadLevel(d.levelIndex, false);
    }
    state.hearts = d.hearts;
    state.camX = d.camX;
    state.won = d.won;
    Object.assign(player, d.player);
    d.boxes.forEach((b, i) => { if (boxes[i]) { boxes[i].x = b[0]; boxes[i].y = b[1]; } });
    d.gates.forEach((oh, i) => { if (gates[i]) gates[i].openH = oh; });
    d.buttons.forEach((p, i) => { if (buttons[i]) buttons[i].pressed = !!p; });
    d.zombies.forEach((z, i) => { if (zombies[i]) { zombies[i].x = z[0]; zombies[i].y = z[1]; zombies[i].dir = z[2]; zombies[i].dead = !!z[3]; } });
    d.winds.forEach((a, i) => { if (winds[i]) winds[i].active = !!a; });
    if (d.breakables) {
        breakables = breakables.filter(br => d.breakables.some(sb => sb[0] === Math.round(br.x) && sb[1] === Math.round(br.y)));
    }
    if (d.seesaws) d.seesaws.forEach((a, i) => { if (seesaws[i]) seesaws[i].angle = a; });
    if (d.mushrooms) d.mushrooms.forEach((b, i) => { if (mushrooms[i]) mushrooms[i].bounce = b; });
}

function sendClientInputs(force = false) {
    if (gameMode !== 'client' || !conn || !conn.open) return;
    const blueJump = !!(inputs.blueJump || keys.blueJump);
    const blueLeft = !!(inputs.blueLeft || keys.blueLeft);
    const sig = (blueJump ? '1' : '0') + (blueLeft ? '1' : '0');
    if (force || sig !== lastClientInputSig) {
        lastClientInputSig = sig;
        conn.send({ type: 'input', blueJump, blueLeft });
    }
}

function hurtPlayer() {
    if (player.invuln > 0) return;
    state.hearts--;
    player.invuln = 1.4;
    playTone(160, 'sawtooth', 0.3, 0.16, 70);
    if (state.hearts <= 0) state.hearts = 5;
    loadLevel(state.levelIndex, false);
}

function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function launchCatapult() {
    const power = 330 + player.slingshotCharge * 330;
    player.vx = player.facing * Math.cos(player.aimAngle) * power;
    player.vy = -Math.sin(player.aimAngle) * power * 1.15 - 120;
    player.grounded = false; player.slingshotCharge = 0; player.aimState = 0; player.catapultFlight = true;
    playTone(260, 'triangle', 0.25, 0.16, 680);
}

function update(dt) {
    if (!gameMode || gameMode === 'client') return;
    if (state.won) { sendSyncState(); return; }
    if (player.invuln > 0) player.invuln -= dt;

    const left = gameMode === 'host' ? remoteInputs.blueLeft : (inputs.blueLeft || keys.blueLeft);
    const right = inputs.redRight || keys.redRight;
    const curl = inputs.redCurl || keys.redCurl;
    const jump = gameMode === 'host' ? remoteInputs.blueJump : (inputs.blueJump || keys.blueJump);
    const jumpJustPressed = jump && !player.wasJumpPressed;
    player.wasJumpPressed = jump;
    player.curled = curl;
    if (left && !right) player.facing = -1;
    if (right && !left) player.facing = 1;

    if (player.curled && player.grounded) {
        player.vx *= Math.pow(0.01, dt);
        if (player.aimState === 0) {
            player.slingshotCharge = 0;
            if (jumpJustPressed) { player.aimState = 1; player.aimAngle = 0.25; player.aimDir = 1; playTone(440, 'sine', 0.08, 0.08); }
        } else if (player.aimState === 1) {
            player.aimAngle += player.aimDir * dt * 1.45;
            if (player.aimAngle >= 1.45) { player.aimAngle = 1.45; player.aimDir = -1; }
            if (player.aimAngle <= 0.12) { player.aimAngle = 0.12; player.aimDir = 1; }
            if (jumpJustPressed) { player.aimState = 2; player.slingshotCharge = 0.05; playTone(560, 'sine', 0.1, 0.1); }
        } else if (player.aimState === 2) {
            if (jump) {
                player.slingshotCharge = Math.min(1.0, player.slingshotCharge + dt * 0.52);
                if (player.slingshotCharge >= 1.0) launchCatapult();
            } else if (player.slingshotCharge > 0.05) launchCatapult();
        }
    } else {
        player.slingshotCharge = 0; player.aimState = 0;
        if (player.grounded) player.catapultFlight = false;
        const moveSpeed = player.curled ? 180 : 250;
        let targetVx = (left ? -moveSpeed : 0) + (right ? moveSpeed : 0);
        if (!player.catapultFlight) player.vx += (targetVx - player.vx) * Math.min(1, 10 * dt);
        else if (targetVx !== 0) player.vx += targetVx * 1.1 * dt;
        if (jumpJustPressed && player.grounded) {
            player.vy = -490; player.grounded = false;
            playTone(320, 'sine', 0.16, 0.12, 540);
        }
    }

    let inUpdraft = false;
    for (const w of winds) {
        if (!w.active) continue;
        if (rectOverlap(player.x - player.r, player.y - player.r, player.r * 2, player.r * 2, w.x, w.y, w.w, w.h)) {
            if (w.vy < 0 && jump && !player.curled) {
                inUpdraft = true; player.catapultFlight = false;
                player.vy = Math.max(-290, player.vy - 1180 * dt);
            }
            if (w.vx !== 0 && !(player.curled && player.grounded)) {
                player.vx += (player.catapultFlight ? w.vx * 0.45 : w.vx * 3.8) * dt;
                if (!player.catapultFlight && w.vx < 0 && player.vx > -140) player.vx = -140;
            }
        }
    }

    const grav = inUpdraft ? 0 : ((player.curled && !player.grounded) ? 1350 : 920);
    player.vy = Math.min(820, player.vy + grav * dt);
    player.x += player.vx * dt;
    if (player.x < 40) { player.x = 40; player.vx = 0; }

    for (const b of boxes) {
        if (rectOverlap(player.x - player.r, player.y - player.r, player.r * 2, player.r * 2, b.x, b.y, b.w, b.h) && player.y + player.r * 0.5 > b.y + 6) {
            b.x = player.x < b.x + b.w / 2 ? player.x + player.r : player.x - player.r - b.w;
        }
    }
    for (let i = breakables.length - 1; i >= 0; i--) {
        const br = breakables[i];
        if (br.type === 'wall' && rectOverlap(player.x - player.r, player.y - player.r, player.r * 2, player.r * 2, br.x, br.y, br.w, br.h)) {
            if (player.curled && Math.abs(player.vx) > 250) { breakables.splice(i, 1); playTone(140, 'square', 0.2, 0.15, 60); }
            else { player.x = player.vx > 0 ? br.x - player.r : br.x + br.w + player.r; player.vx = 0; }
        }
    }

    const solids = [...platforms];
    for (const g of gates) if (g.openH < g.h - 8) solids.push({ x: g.x, y: g.y, w: g.w, h: g.h - g.openH });
    for (const s of solids) {
        if (rectOverlap(player.x - player.r, player.y - player.r + 4, player.r * 2, player.r * 2 - 8, s.x, s.y, s.w, s.h)) {
            if (player.vx > 0) player.x = s.x - player.r; else if (player.vx < 0) player.x = s.x + s.w + player.r;
            player.vx = 0;
        }
    }

    const prevVy = player.vy;
    player.y += player.vy * dt;
    player.grounded = false;

    for (let i = breakables.length - 1; i >= 0; i--) {
        const br = breakables[i];
        if (br.type === 'floor' && rectOverlap(player.x - player.r, player.y - player.r, player.r * 2, player.r * 2, br.x, br.y, br.w, br.h)) {
            if (player.curled && prevVy > 340) { breakables.splice(i, 1); playTone(130, 'sawtooth', 0.22, 0.16, 55); }
            else if (player.vy >= 0 && player.y - player.r < br.y) { player.y = br.y - player.r; player.vy = 0; player.grounded = true; }
        }
    }
    for (const s of [...solids, ...boxes]) {
        if (rectOverlap(player.x - player.r + 4, player.y - player.r, player.r * 2 - 8, player.r * 2, s.x, s.y, s.w, s.h)) {
            if (player.vy >= 0 && player.y < s.y + 18) { player.y = s.y - player.r; player.vy = 0; player.grounded = true; }
            else if (player.vy < 0 && player.y > s.y + s.h - 18) { player.y = s.y + s.h + player.r; player.vy = 0; }
        }
    }

    for (const rp of ramps) {
        if (player.x >= rp.x1 - 8 && player.x <= rp.x2 + 8) {
            const t = Math.max(0, Math.min(1, (player.x - rp.x1) / (rp.x2 - rp.x1)));
            const ry = rp.y1 + t * (rp.y2 - rp.y1);
            if (player.vy >= 0 && player.y + player.r >= ry - 6 && player.y - player.r < ry + 24) {
                player.y = ry - player.r; player.vy = 0; player.grounded = true;
                if (player.curled) { player.vx = Math.min(540, player.vx + 560 * dt); player.catapultFlight = true; }
            }
        }
    }
    for (const sw of seesaws) {
        let torque = 0;
        if (Math.abs(player.x - sw.cx) <= sw.halfW) {
            const sy = sw.cy + (player.x - sw.cx) * Math.tan(sw.angle);
            if (player.vy >= 0 && player.y + player.r >= sy - 10 && player.y - player.r < sy + 22) {
                player.y = sy - player.r; player.vy = 0; player.grounded = true;
                torque = ((player.x - sw.cx) / sw.halfW) * (player.curled ? 1.5 : 0.75);
            }
        }
        sw.angle += (Math.max(-0.28, Math.min(0.28, torque * 0.35 - 0.14)) - sw.angle) * Math.min(1, 5 * dt);
    }
    for (const m of mushrooms) {
        m.bounce = Math.max(0, m.bounce - dt * 4);
        if (rectOverlap(player.x - player.r, player.y - player.r, player.r * 2, player.r * 2, m.x, m.y, m.w, m.h) && player.vy >= 0) {
            player.y = m.y - player.r; player.vy = m.vy; player.grounded = false; m.bounce = 1; playTone(380, 'sine', 0.2, 0.15, 760);
        }
    }

    for (const b of boxes) {
        let boxFloat = false;
        for (const w of winds) if (w.active && w.vy < 0 && rectOverlap(b.x, b.y, b.w, b.h, w.x, w.y, w.w, w.h)) { b.vy = Math.max(-240, (b.vy || 0) - 1150 * dt); boxFloat = true; }
        if (!boxFloat) b.vy = Math.min(600, (b.vy || 0) + 900 * dt);
        b.y += b.vy * dt;
        for (const m of mushrooms) if (rectOverlap(b.x, b.y, b.w, b.h, m.x, m.y, m.w, m.h) && b.vy >= 0) { b.y = m.y - b.h; b.vy = m.vy * 0.92; m.bounce = 1; }
        for (const s of solids) {
            if (rectOverlap(b.x + 2, b.y, b.w - 4, b.h, s.x, s.y, s.w, s.h) && b.vy >= 0 && b.y + b.h - b.vy * dt <= s.y + 12) {
                b.y = s.y - b.h; b.vy = 0;
            }
        }
    }
    for (const btn of buttons) {
        let active = btn.sticky && btn.pressed;
        if (rectOverlap(player.x - player.r, player.y - player.r, player.r * 2, player.r * 2 + 4, btn.x, btn.y - 8, btn.w, btn.h + 8)) active = true;
        for (const b of boxes) if (rectOverlap(b.x, b.y, b.w, b.h + 4, btn.x, btn.y - 8, btn.w, btn.h + 8)) active = true;
        if (active && !btn.pressed) playTone(520, 'sine', 0.15, 0.12, 740);
        btn.pressed = active;
        if (btn.toggleWind) { for (const w of winds) if (w.id === btn.id) w.active = !btn.pressed; }
        else for (const g of gates) if (g.id === btn.id) g.openH += ((btn.pressed ? g.h - 14 : 0) - g.openH) * Math.min(1, 6 * dt);
    }

    if (player.y > GAME_H + 80) hurtPlayer();
    for (const h of hazards) if (rectOverlap(player.x - player.r + 6, player.y - player.r + 6, player.r * 2 - 12, player.r * 2 - 6, h.x, h.y, h.w, h.h)) hurtPlayer();
    for (const z of zombies) {
        if (z.dead) continue;
        const chase = Math.abs(player.y - (z.y - 24)) < 75 && Math.abs(player.x - z.x) < 340;
        if (chase && Math.abs(player.x - z.x) > 8) z.dir = player.x < z.x ? -1 : 1;
        const nextX = z.x + z.dir * (chase ? 105 : 60) * dt;
        const lookX = nextX + z.dir * 16;
        const hasFloor = solids.some(s => lookX >= s.x && lookX <= s.x + s.w && Math.abs(s.y - z.y) < 10) ||
            breakables.some(br => br.type === 'floor' && lookX >= br.x && lookX <= br.x + br.w && Math.abs(br.y - z.y) < 10);
        const hitWall = solids.some(s => rectOverlap(nextX - 14, z.y - 46, 28, 40, s.x, s.y, s.w, s.h)) ||
            breakables.some(br => br.type === 'wall' && rectOverlap(nextX - 14, z.y - 46, 28, 40, br.x, br.y, br.w, br.h));
        if (hasFloor && !hitWall && nextX > 40) z.x = nextX; else z.dir *= -1;
        if (rectOverlap(player.x - player.r, player.y - player.r, player.r * 2, player.r * 2, z.x - 18, z.y - 48, 36, 48)) {
            if (player.curled) { z.dead = true; if (player.vy > 0) player.vy = -320; playTone(190, 'square', 0.22, 0.16, 65); }
            else hurtPlayer();
        }
    }

    if (player.x >= goalX) {
        playTone(440, 'triangle', 0.35, 0.18, 880);
        if (state.levelIndex + 1 >= MAX_LEVELS) { state.won = true; }
        else { state.levelIndex++; loadLevel(state.levelIndex, true); }
    }
    player.rot += (player.vx * dt) / player.r;
    state.camX += (Math.max(0, player.x - GAME_W * 0.42) - state.camX) * Math.min(1, 7 * dt);
    sendSyncState();
}

function drawHedgehog() {
    ctx.save(); ctx.translate(player.x, player.y);
    if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0) ctx.globalAlpha = 0.45;
    if (player.aimState > 0) {
        const len = player.aimState === 1 ? 85 : 65 + player.slingshotCharge * 85;
        const tx = player.facing * Math.cos(player.aimAngle) * len, ty = -Math.sin(player.aimAngle) * len;
        ctx.strokeStyle = player.aimState === 2 ? '#22c55e' : '#ffeb3b'; ctx.fillStyle = '#e5534b'; ctx.lineWidth = 4; ctx.setLineDash([8, 6]);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(tx, ty, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        if (player.aimState === 2) {
            ctx.fillStyle = '#0d0f12'; ctx.fillRect(-34, -52, 68, 12);
            ctx.fillStyle = player.slingshotCharge > 0.7 ? '#ef4444' : '#22c55e';
            ctx.fillRect(-31, -49, 62 * player.slingshotCharge, 6);
        }
    }
    ctx.strokeStyle = '#0d0f12'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    if (player.curled) {
        ctx.rotate(player.rot);
        for (let i = 0; i < 14; i++) {
            const ang = (i / 14) * Math.PI * 2;
            ctx.fillStyle = i % 2 ? '#5c3a21' : '#3d2514';
            ctx.beginPath(); ctx.moveTo(Math.cos(ang - 0.22) * 17, Math.sin(ang - 0.22) * 17);
            ctx.lineTo(Math.cos(ang) * 31, Math.sin(ang) * 31); ctx.lineTo(Math.cos(ang + 0.22) * 17, Math.sin(ang + 0.22) * 17);
            ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fillStyle = '#7c5338'; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fillStyle = '#d9b38c'; ctx.fill();
        ctx.strokeStyle = '#e5534b'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI); ctx.stroke();
        ctx.strokeStyle = '#20b8f9'; ctx.beginPath(); ctx.arc(0, 0, 12, Math.PI, Math.PI * 2); ctx.stroke();
    } else {
        ctx.scale(player.facing, 1);
        const walk = player.grounded && Math.abs(player.vx) > 15 ? Math.sin(performance.now() * 0.018) * 5 : 0;
        ctx.fillStyle = '#b58860'; ctx.beginPath(); ctx.ellipse(-8 - walk, 19, 6, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#4a2c18'; ctx.beginPath(); ctx.moveTo(-2, -20);
        for (const [sx, sy] of [[-14,-25],[-10,-15],[-24,-18],[-17,-8],[-28,-7],[-20,2],[-29,6],[-19,12],[-23,17],[-8,17]]) ctx.lineTo(sx, sy);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#6e472b'; ctx.beginPath(); ctx.arc(-5, -1, 18, Math.PI * 0.55, Math.PI * 1.9); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f3d5b5'; ctx.beginPath(); ctx.moveTo(-6, 16);
        ctx.quadraticCurveTo(10, 18, 17, 10); ctx.quadraticCurveTo(27, 4, 24, -1); ctx.quadraticCurveTo(16, -6, 9, -12); ctx.quadraticCurveTo(-5, -14, -6, 16);
        ctx.fill(); ctx.stroke();
        ctx.save(); ctx.translate(1, -14); ctx.rotate(0.25);
        ctx.fillStyle = '#e5534b'; ctx.fillRect(-9, -4, 9, 6); ctx.strokeRect(-9, -4, 9, 6);
        ctx.fillStyle = '#20b8f9'; ctx.fillRect(0, -4, 9, 6); ctx.strokeRect(0, -4, 9, 6); ctx.restore();
        ctx.fillStyle = '#d9a77d'; ctx.beginPath(); ctx.arc(-2, -8, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f4978e'; ctx.beginPath(); ctx.arc(-2, -8, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#d9a77d'; ctx.beginPath(); ctx.ellipse(7 + walk, 19, 6, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(244, 114, 182, 0.55)'; ctx.beginPath(); ctx.ellipse(11, 5, 4.5, 3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#0d0f12'; ctx.beginPath(); ctx.arc(11, -3, 4.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(12.2, -4.5, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#2b1d14'; ctx.beginPath(); ctx.arc(24, -1, 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(25, -2.5, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(16, 4, 3.5, 0.2, Math.PI * 0.85); ctx.stroke();
    }
    ctx.restore();
}

function drawHeart(x, y, r, fill) {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = fill; ctx.strokeStyle = '#0d0f12'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, r * 0.75);

    ctx.bezierCurveTo(r * 0.7, -r * 1.1, r * 1.3, -r * 0.1, 0, r * 0.75);

function render() {
    const rect = canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = rect.width || window.innerWidth, h = rect.height || window.innerHeight;
    if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) { canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr); }
    ctx.save(); ctx.scale(dpr, dpr); ctx.fillStyle = '#1e2229'; ctx.fillRect(0, 0, w, h);

    const portrait = h > w;
    view.scale = portrait ? Math.min(w / GAME_H, h / GAME_W) : Math.min(w / GAME_W, h / GAME_H);
    view.rotation = portrait ? -Math.PI / 2 : 0; view.offsetX = w / 2; view.offsetY = h / 2;
    ctx.translate(view.offsetX, view.offsetY); ctx.rotate(view.rotation); ctx.scale(view.scale, view.scale); ctx.translate(-GAME_W / 2, -GAME_H / 2);

    const sky = ctx.createLinearGradient(0, 0, 0, GAME_H);
    sky.addColorStop(0, '#72b6f6'); sky.addColorStop(0.65, '#cde8f6'); sky.addColorStop(1, '#fde4be');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, GAME_W, GAME_H);

    ctx.lineWidth = 4; ctx.strokeStyle = '#0d0f12';
    for (let i = 0; i < 6; i++) {
        const cx = ((i * 290 - state.camX * 0.1 + 90) % 1740 + 1740) % 1740 - 180, cy = 75 + (i % 3) * 48;
        ctx.fillStyle = '#ffffff'; ctx.beginPath();
        ctx.arc(cx, cy, 24, Math.PI * 0.5, Math.PI * 1.5); ctx.arc(cx + 26, cy - 14, 30, Math.PI, Math.PI * 1.85);
        ctx.arc(cx + 58, cy - 6, 26, Math.PI * 1.15, Math.PI * 1.95); ctx.arc(cx + 76, cy + 4, 20, Math.PI * 1.5, Math.PI * 0.5);
        ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    const treeCols = ['#d95338', '#e67e22', '#c83e2b'];
    for (let i = 0; i < 8; i++) {
        const tx = ((i * 240 - state.camX * 0.22) % 1920 + 1920) % 1920 - 160;
        const hillY = 445 + Math.sin((tx + state.camX * 0.15) * 0.004) * 35, crownY = hillY - 115 - (i % 2) * 18;
        ctx.fillStyle = '#5c3a21'; ctx.fillRect(tx - 14, crownY + 20, 28, GAME_H - crownY); ctx.strokeRect(tx - 14, crownY + 20, 28, GAME_H - crownY);
        ctx.fillStyle = treeCols[i % 3]; ctx.beginPath();
        ctx.arc(tx - 32, crownY + 12, 34, Math.PI * 0.45, Math.PI * 1.65); ctx.arc(tx, crownY - 18, 42, Math.PI * 0.95, Math.PI * 2.05);
        ctx.arc(tx + 32, crownY + 12, 34, Math.PI * 1.35, Math.PI * 0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    const hillGrad = ctx.createLinearGradient(0, 410, 0, GAME_H);
    hillGrad.addColorStop(0, '#d49a6a'); hillGrad.addColorStop(1, '#8c5832');
    ctx.fillStyle = hillGrad; ctx.beginPath(); ctx.moveTo(0, GAME_H);
    for (let x = 0; x <= GAME_W + 80; x += 40) ctx.lineTo(x, 445 + Math.sin((x + state.camX * 0.15) * 0.004) * 35);
    ctx.lineTo(GAME_W, GAME_H); ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.save(); ctx.translate(-state.camX, 0);
    for (const wi of winds) {
        if (!wi.active) continue;
        const wg = ctx.createLinearGradient(wi.x, wi.y, wi.x, wi.y + wi.h);
        wg.addColorStop(0, 'rgba(255,255,255,0.12)'); wg.addColorStop(0.5, 'rgba(224,242,254,0.38)'); wg.addColorStop(1, 'rgba(255,255,255,0.15)');
        ctx.fillStyle = wg; ctx.fillRect(wi.x, wi.y, wi.w, wi.h); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3;
        const t = performance.now() * 0.14;
        for (let i = 0; i < 6; i++) {
            const prog = ((t + i * 45) % 180) / 180;
            const wx = wi.vx < 0 ? wi.x + wi.w * (1 - prog) : wi.x + (wi.w * (i + 0.5)) / 6 + Math.sin(prog * 6 + i) * 10;
            const wy = wi.vy < 0 ? wi.y + wi.h * (1 - prog) : wi.y + (wi.h * (i + 0.5)) / 6;
            ctx.beginPath(); if (wi.vy < 0) { ctx.moveTo(wx, wy); ctx.lineTo(wx, wy + 26); } else { ctx.moveTo(wx, wy); ctx.lineTo(wx + 28, wy); } ctx.stroke();
            ctx.fillStyle = i % 2 ? '#f59e0b' : '#ef4444'; ctx.beginPath(); ctx.ellipse(wx + 6, wy, 5, 3, prog * 4, 0, Math.PI * 2); ctx.fill();
        }
    }

    ctx.lineWidth = 5; ctx.strokeStyle = '#0d0f12';
    for (const p of platforms) {
        const dirtGrad = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        dirtGrad.addColorStop(0, '#7a5238'); dirtGrad.addColorStop(0.55, '#4e3322'); dirtGrad.addColorStop(1, '#26170e');
        ctx.fillStyle = dirtGrad; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#55b848'; ctx.fillRect(p.x - 2, p.y, p.w + 4, 20);
        ctx.fillStyle = '#7ad667'; ctx.fillRect(p.x, p.y + 3, p.w, 6); ctx.strokeRect(p.x - 2, p.y, p.w + 4, 20);
    }
    for (const rp of ramps) {
        ctx.fillStyle = '#5c3a21'; ctx.beginPath(); ctx.moveTo(rp.x1, rp.y1); ctx.lineTo(rp.x2, rp.y2); ctx.lineTo(rp.x2, GAME_H); ctx.lineTo(rp.x1, GAME_H); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#55b848'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(rp.x1, rp.y1 + 5); ctx.lineTo(rp.x2, rp.y2 + 5); ctx.stroke();
        ctx.strokeStyle = '#0d0f12'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(rp.x1, rp.y1); ctx.lineTo(rp.x2, rp.y2); ctx.stroke();
    }
    for (const sw of seesaws) {
        ctx.fillStyle = '#4b5563'; ctx.beginPath(); ctx.moveTo(sw.cx - 18, sw.cy + 36); ctx.lineTo(sw.cx, sw.cy); ctx.lineTo(sw.cx + 18, sw.cy + 36); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.save(); ctx.translate(sw.cx, sw.cy); ctx.rotate(sw.angle);
        ctx.fillStyle = '#d97706'; ctx.fillRect(-sw.halfW, -8, sw.halfW * 2, 16); ctx.strokeRect(-sw.halfW, -8, sw.halfW * 2, 16); ctx.restore();
    }
    for (const m of mushrooms) {
        const sq = m.bounce * 8;
        ctx.fillStyle = '#f3d5b5'; ctx.fillRect(m.x + 22, m.y + 12 + sq, 28, m.h - 10 - sq); ctx.strokeRect(m.x + 22, m.y + 12 + sq, 28, m.h - 10 - sq);
        ctx.fillStyle = '#e5534b'; ctx.beginPath(); ctx.ellipse(m.x + m.w / 2, m.y + 12 + sq, m.w / 2, 14, 0, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    for (const br of breakables) {
        if (br.type === 'wall') {
            ctx.fillStyle = '#8d5b3c'; ctx.fillRect(br.x, br.y, br.w, br.h); ctx.strokeRect(br.x, br.y, br.w, br.h);
            ctx.beginPath(); for (let y = br.y + 28; y < br.y + br.h; y += 28) { ctx.moveTo(br.x, y); ctx.lineTo(br.x + br.w, y); }
            ctx.moveTo(br.x + 8, br.y + 15); ctx.lineTo(br.x + br.w - 6, br.y + br.h / 2); ctx.lineTo(br.x + 10, br.y + br.h - 14); ctx.stroke();
        } else {
            ctx.fillStyle = 'rgba(125, 211, 252, 0.85)'; ctx.fillRect(br.x, br.y, br.w, br.h);
            ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(br.x + 8, br.y + 5, br.w - 16, 6); ctx.strokeRect(br.x, br.y, br.w, br.h);
            ctx.beginPath(); ctx.moveTo(br.x + 22, br.y); ctx.lineTo(br.x + 48, br.y + 18); ctx.lineTo(br.x + 36, br.y + br.h); ctx.stroke();
        }
    }
    for (const b of buttons) {
        const bh = b.pressed ? 5 : b.h;
        ctx.fillStyle = b.pressed ? '#22c55e' : (b.toggleWind ? '#20b8f9' : '#e5534b');
        ctx.fillRect(b.x + 4, b.y + (b.h - bh), b.w - 8, bh); ctx.strokeRect(b.x + 4, b.y + (b.h - bh), b.w - 8, bh);
        ctx.fillStyle = '#4b5563'; ctx.fillRect(b.x - 4, b.y + b.h - 4, b.w + 8, 6); ctx.strokeRect(b.x - 4, b.y + b.h - 4, b.w + 8, 6);
    }
    for (const g of gates) {
        const curH = Math.max(14, g.h - g.openH);
        ctx.fillStyle = '#eab308'; ctx.fillRect(g.x, g.y, g.w, curH);
        ctx.fillStyle = '#ca8a04'; ctx.fillRect(g.x + 6, g.y + 4, g.w - 12, Math.max(4, curH - 8)); ctx.strokeRect(g.x, g.y, g.w, curH);
        ctx.fillStyle = '#0d0f12'; for (let y = g.y + 16; y < g.y + curH - 10; y += 26) { ctx.beginPath(); ctx.arc(g.x + g.w / 2, y, 3.5, 0, Math.PI * 2); ctx.fill(); }
    }
    for (const bx of boxes) {
        ctx.fillStyle = '#b45309'; ctx.fillRect(bx.x, bx.y, bx.w, bx.h); ctx.fillStyle = '#d97706'; ctx.fillRect(bx.x + 6, bx.y + 6, bx.w - 12, bx.h - 12);
        ctx.strokeRect(bx.x, bx.y, bx.w, bx.h); ctx.strokeRect(bx.x + 6, bx.y + 6, bx.w - 12, bx.h - 12);
        ctx.beginPath(); ctx.moveTo(bx.x + 6, bx.y + 6); ctx.lineTo(bx.x + bx.w - 6, bx.y + bx.h - 6); ctx.moveTo(bx.x + bx.w - 6, bx.y + 6); ctx.lineTo(bx.x + 6, bx.y + bx.h - 6); ctx.stroke();
    }
    for (const hz of hazards) {
        for (let x = hz.x; x < hz.x + hz.w; x += 20) {
            ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.moveTo(x, hz.y + hz.h); ctx.lineTo(x + 10, hz.y - 3); ctx.lineTo(x + 20, hz.y + hz.h); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#e5534b'; ctx.beginPath(); ctx.moveTo(x + 4, hz.y + 7); ctx.lineTo(x + 10, hz.y - 3); ctx.lineTo(x + 16, hz.y + 7); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x, hz.y + hz.h); ctx.lineTo(x + 10, hz.y - 3); ctx.lineTo(x + 20, hz.y + hz.h); ctx.closePath(); ctx.stroke();
        }
    }
    for (const z of zombies) if (!z.dead) {
        ctx.save(); ctx.translate(z.x, z.y); ctx.scale(z.dir, 1);
        const legA = Math.sin(performance.now() * 0.014 + z.x * 0.08) * 0.55;
        ctx.lineWidth = 4; ctx.strokeStyle = '#0d0f12'; ctx.fillStyle = '#3b4252';
        ctx.save(); ctx.translate(-3, -14); ctx.rotate(legA); ctx.fillRect(-3.5, 0, 7, 14); ctx.strokeRect(-3.5, 0, 7, 14); ctx.restore();
        ctx.save(); ctx.translate(3, -14); ctx.rotate(-legA); ctx.fillRect(-3.5, 0, 7, 14); ctx.strokeRect(-3.5, 0, 7, 14); ctx.restore();
        ctx.fillStyle = '#6b4c7a'; ctx.fillRect(-11, -34, 22, 21); ctx.strokeRect(-11, -34, 22, 21);
        ctx.fillStyle = '#7fa650'; ctx.fillRect(-12, -52, 24, 19); ctx.strokeRect(-12, -52, 24, 19);
        ctx.fillRect(4, -31 + legA * 3, 18, 7); ctx.strokeRect(4, -31 + legA * 3, 18, 7);
        ctx.fillStyle = '#e5534b'; ctx.beginPath(); ctx.arc(6, -43, 3.2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    const goalPlatY = platforms[platforms.length - 1].y;
    ctx.fillStyle = '#e5e7eb'; ctx.fillRect(goalX, goalPlatY - 150, 12, 150); ctx.strokeRect(goalX, goalPlatY - 150, 12, 150);
    ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(goalX + 6, goalPlatY - 154, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const wave = Math.sin(performance.now() * 0.006) * 6;
    ctx.fillStyle = '#20b8f9'; ctx.beginPath(); ctx.moveTo(goalX + 12, goalPlatY - 144); ctx.lineTo(goalX + 92, goalPlatY - 118 + wave); ctx.lineTo(goalX + 12, goalPlatY - 88); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e5534b'; ctx.beginPath(); ctx.moveTo(goalX + 12, goalPlatY - 128); ctx.lineTo(goalX + 62, goalPlatY - 118 + wave * 0.6); ctx.lineTo(goalX + 12, goalPlatY - 104); ctx.closePath(); ctx.fill();

    drawHedgehog();
    ctx.restore();

    for (let i = 0; i < 5; i++) drawHeart(36 + i * 38, 34, 14, i < state.hearts ? '#e5534b' : '#4b5563');
    ctx.fillStyle = 'rgba(13,15,18,0.75)'; ctx.strokeStyle = '#0d0f12'; ctx.lineWidth = 4;
    ctx.fillRect(225, 14, 175, 40); ctx.strokeRect(225, 14, 175, 40);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 19px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('Level ' + (state.levelIndex + 1) + ' / ' + MAX_LEVELS, 312, 41);

    if (gameMode === 'host' || gameMode === 'client') {
        ctx.fillStyle = gameMode === 'host' ? '#e5534b' : '#20b8f9';
        ctx.fillRect(412, 14, 165, 40); ctx.strokeRect(412, 14, 165, 40);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui';
        ctx.fillText(gameMode === 'host' ? 'ROT • ' + roomCode : 'BLAU • ' + roomCode, 494, 40);
    }

    const drawBtn = (b, txt) => {
        ctx.fillStyle = '#374151'; ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, b.h * 0.4); ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center'; ctx.fillText(txt, b.x + b.w / 2, b.y + b.h / 2 + 5);
    };
    drawBtn(uiButtons.resetRoom, 'LEVEL RESET');
    drawBtn(uiButtons.sound, soundOn ? 'TON' : 'AUS');

    for (const b of getVisibleButtons()) {
        const pressed = inputs[b.id] || keys[b.id];
        ctx.save(); ctx.translate(b.x, b.y + (pressed ? 5 : 0));
        if (!pressed) { ctx.fillStyle = '#0d0f12'; ctx.beginPath(); ctx.arc(0, 6, b.r, 0, Math.PI * 2); ctx.fill(); }
        ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = '#0d0f12'; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.arc(0, -b.r * 0.28, b.r * 0.65, Math.PI * 1.1, Math.PI * 1.9); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
        ctx.font = 'bold 16px system-ui'; ctx.fillText(b.label, 0, -1); ctx.font = 'bold 12px system-ui'; ctx.fillText(b.sub, 0, 16);
        ctx.restore();
    }

    if (state.won) {
        ctx.fillStyle = 'rgba(13, 15, 18, 0.78)'; ctx.fillRect(0, 0, GAME_W, GAME_H);
        ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#0d0f12'; ctx.lineWidth = 6;
        ctx.fillRect(GAME_W / 2 - 270, GAME_H / 2 - 110, 540, 220); ctx.strokeRect(GAME_W / 2 - 270, GAME_H / 2 - 110, 540, 220);
        ctx.fillStyle = '#0d0f12'; ctx.textAlign = 'center';
        ctx.font = 'bold 34px system-ui'; ctx.fillText('GESCHAFFT!', GAME_W / 2, GAME_H / 2 - 35);
        ctx.font = 'bold 20px system-ui'; ctx.fillText('Alle 10 Level gemeinsam gemeistert!', GAME_W / 2, GAME_H / 2 + 10);
        ctx.font = 'bold 16px system-ui'; ctx.fillText('Tippen für neuen Durchlauf', GAME_W / 2, GAME_H / 2 + 58);
    }
    ctx.restore();
}

function toGameCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    let dx = (clientX - rect.left) - view.offsetX, dy = (clientY - rect.top) - view.offsetY;
    const c = Math.cos(-view.rotation), s = Math.sin(-view.rotation);
    return { x: (dx * c - dy * s) / view.scale + GAME_W / 2, y: (dx * s + dy * c) / view.scale + GAME_H / 2 };
}
function syncPointers() {
    inputs.redRight = inputs.redCurl = inputs.blueJump = inputs.blueLeft = false;
    const visible = getVisibleButtons();
    for (const pt of activePointers.values()) for (const b of visible) if (Math.hypot(pt.x - b.x, pt.y - b.y) <= b.hitR) inputs[b.id] = true;
    sendClientInputs();
}
const hitRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
canvas.addEventListener('pointerdown', e => {
    if (!gameMode) return;
    const pt = toGameCoords(e.clientX, e.clientY);
    if (hitRect(pt, uiButtons.sound)) { soundOn = !soundOn; return; }
    if (state.won || hitRect(pt, uiButtons.resetRoom)) {
        if (gameMode === 'client') {
            if (conn && conn.open) conn.send({ type: 'action', action: state.won ? 'restart' : 'reset' });
            return;
        }
        if (state.won) { state.won = false; state.levelIndex = 0; state.hearts = 5; loadLevel(0, true); }
        else loadLevel(state.levelIndex, false);
        sendSyncState(true);
        return;
    }
    activePointers.set(e.pointerId, pt); syncPointers();
});
canvas.addEventListener('pointermove', e => { if (activePointers.has(e.pointerId)) { activePointers.set(e.pointerId, toGameCoords(e.clientX, e.clientY)); syncPointers(); } });
const endPtr = e => { activePointers.delete(e.pointerId); syncPointers(); };
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);

const keyMap = { KeyD: 'redRight', KeyS: 'redCurl', KeyW: 'blueJump', ArrowUp: 'blueJump', KeyA: 'blueLeft', ArrowLeft: 'blueLeft', ArrowRight: 'redRight', ArrowDown: 'redCurl' };
window.addEventListener('keydown', e => { if (keyMap[e.code]) { keys[keyMap[e.code]] = true; sendClientInputs(); } });
window.addEventListener('keyup', e => { if (keyMap[e.code]) { keys[keyMap[e.code]] = false; sendClientInputs(); } });

// Overlay-Menü & PeerJS-Setup
const menuOverlay = document.getElementById('menuOverlay');
const hostPanel = document.getElementById('hostPanel');
const joinPanel = document.getElementById('joinPanel');
const roomCodeDisplay = document.getElementById('roomCodeDisplay');
const hostStatus = document.getElementById('hostStatus');
const codeInput = document.getElementById('codeInput');
const joinStatus = document.getElementById('joinStatus');

function startGameMode(mode) {
    gameMode = mode;
    menuOverlay.classList.add('hidden');
    if (mode !== 'client') {
        state.won = false; state.levelIndex = 0; state.hearts = 5;
        loadLevel(0, true);
    }
}

document.getElementById('btnLocal').addEventListener('click', () => startGameMode('local'));

document.getElementById('btnHost').addEventListener('click', () => {
    joinPanel.classList.add('hidden');
    hostPanel.classList.remove('hidden');
    if (peer) { try { peer.destroy(); } catch (e) {} }
    const initHost = () => {
        roomCode = String(Math.floor(1000 + Math.random() * 9000));
        roomCodeDisplay.textContent = roomCode;
        hostStatus.textContent = 'Verbinde mit Server...';
        peer = new Peer('igel-' + roomCode);
        peer.on('open', () => { hostStatus.textContent = 'Warte auf Spieler 2 (Blau)...'; });
        peer.on('error', err => {
            if (err && err.type === 'unavailable-id') initHost();
            else hostStatus.textContent = 'Fehler: ' + (err.type || err.message);
        });
        peer.on('connection', c => {
            conn = c;
            conn.on('open', () => {
                startGameMode('host');
                sendSyncState(true);
            });
            conn.on('data', d => {
                if (!d) return;
                if (d.type === 'input') {
                    remoteInputs.blueJump = !!d.blueJump;
                    remoteInputs.blueLeft = !!d.blueLeft;
                } else if (d.type === 'action') {
                    if (d.action === 'restart') { state.won = false; state.levelIndex = 0; state.hearts = 5; loadLevel(0, true); }
                    else if (d.action === 'reset') { loadLevel(state.levelIndex, false); }
                    sendSyncState(true);
                }
            });
            conn.on('close', () => {
                gameMode = null;
                menuOverlay.classList.remove('hidden');
                hostStatus.textContent = 'Spieler 2 getrennt. Neuen Raum erstellen?';
            });
        });
    };
    initHost();
});

document.getElementById('btnJoin').addEventListener('click', () => {
    hostPanel.classList.add('hidden');
    joinPanel.classList.remove('hidden');
    joinStatus.textContent = '';
    codeInput.focus();
});

document.getElementById('connectBtn').addEventListener('click', () => {
    const code = codeInput.value.replace(/\D/g, '').slice(0, 4);
    if (code.length !== 4) { joinStatus.textContent = 'Bitte 4 Ziffern eingeben.'; return; }
    roomCode = code;
    joinStatus.textContent = 'Suche Raum ' + code + '...';
    if (peer) { try { peer.destroy(); } catch (e) {} }
    peer = new Peer();
    peer.on('open', () => {
        conn = peer.connect('igel-' + code);
        conn.on('open', () => {
            startGameMode('client');
            sendClientInputs(true);
        });
        conn.on('data', d => {
            if (d && d.type === 'state') applySyncState(d);
        });
        conn.on('close', () => {
            gameMode = null;
            menuOverlay.classList.remove('hidden');
            joinStatus.textContent = 'Verbindung zum Host getrennt.';
        });
        conn.on('error', () => { joinStatus.textContent = 'Verbindung fehlgeschlagen.'; });
    });
    peer.on('error', err => { joinStatus.textContent = 'Raum nicht gefunden (' + (err.type || 'Fehler') + ').'; });
});

loadLevel(0, true);
let lastTime = performance.now();
function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    update(dt); render();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
