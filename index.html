<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d0f12">
    <link rel="manifest" href="manifest.json?v=2">
    <title>Igelis Reise – Das Abenteuer und Rätselspiel</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2b2f36; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        #menuOverlay {
            position: fixed; inset: 0; background: rgba(13, 15, 18, 0.88);
            display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px;
            touch-action: manipulation;
        }
        .menu-card {
            background: #1e2229; border: 4px solid #0d0f12; border-radius: 18px;
            padding: 24px 26px; width: 100%; max-width: 400px; text-align: center;
            color: #fff; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }
        .menu-card h1 { margin: 0 0 6px; font-size: 26px; color: #facc15; letter-spacing: 0.5px; }
        .menu-card p.sub { margin: 0 0 20px; font-size: 14px; color: #cbd5e1; }
        .m-btn {
            display: block; width: 100%; padding: 14px 16px; margin: 10px 0;
            border: 3px solid #0d0f12; border-radius: 12px; font-size: 17px; font-weight: 800;
            color: #fff; cursor: pointer; text-align: center; touch-action: manipulation;
        }
        .m-btn:active { transform: translateY(2px); }
        .m-local { background: #374151; }
        .m-red { background: #e5534b; }
        .m-blue { background: #20b8f9; color: #0d0f12; }
        .m-back { background: #4b5563; font-size: 14px; padding: 10px; margin-top: 14px; }
        .code-box {
            background: #0d0f12; border: 3px solid #e5534b; border-radius: 12px;
            padding: 14px; margin: 14px 0; font-size: 44px; font-weight: 900;
            letter-spacing: 8px; color: #facc15;
        }
        .code-input {
            width: 100%; padding: 12px; font-size: 32px; font-weight: 900;
            text-align: center; letter-spacing: 8px; border-radius: 12px;
            border: 3px solid #20b8f9; background: #0d0f12; color: #fff;
            margin: 12px 0; user-select: text; -webkit-user-select: text;
            touch-action: manipulation;
        }
        .status-txt { font-size: 14px; color: #94a3b8; min-height: 20px; margin-top: 8px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div id="menuOverlay">
    <div class="menu-card">
        <h1>Igelis Reise</h1>
        <p class="sub">Das Abenteuer und Rätselspiel</p>
        <div id="mainMenu">
            <button type="button" class="m-btn m-local" id="btnLocal">Lokal (1 Gerät)</button>
            <button type="button" class="m-btn m-red" id="btnHost">Raum erstellen (Rot)</button>
            <button type="button" class="m-btn m-blue" id="btnJoinView">Beitreten (Blau)</button>
            <button type="button" class="m-btn m-back" id="btnFullscreenMenu">Vollbildschirm</button>
        </div>
        <div id="hostPanel" class="hidden">
            <div>Dein Raum-Code:</div>
            <div class="code-box" id="roomCodeDisplay">----</div>
            <div class="status-txt" id="hostStatus">Erstelle Raum...</div>
            <button type="button" class="m-btn m-back" id="btnCancelHost">Zurück</button>
        </div>
        <div id="joinPanel" class="hidden">
            <div>4-stelligen Code eingeben:</div>
            <input class="code-input" id="codeInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off">
            <button type="button" class="m-btn m-blue" id="btnConnect">Verbinden</button>
            <div class="status-txt" id="joinStatus"></div>
            <button type="button" class="m-btn m-back" id="btnCancelJoin">Zurück</button>
        </div>
    </div>
</div>
<canvas id="gameCanvas"></canvas>
<script src="state.js?v=2"></script>
<script src="modules-standard.js?v=2"></script>
<script src="modules-expert.js?v=2"></script>
<script src="levels.js?v=2"></script>
<script src="net.js?v=2"></script>
<script src="input.js?v=2"></script>
<script src="sprites.js?v=2"></script>
<script src="render-world.js?v=2"></script>
<script src="render-entities.js?v=2"></script>
<script src="render.js?v=2"></script>
<script src="game.js?v=2"></script>
</body>
</html>
